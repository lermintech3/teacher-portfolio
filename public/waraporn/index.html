<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แฟ้มสะสมผลงานครู</title>
  <meta name="description" content="แฟ้มสะสมผลงาน งานที่รับผิดชอบ เกียรติบัตร และการพัฒนาตนเอง">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/ios.css">
  <link rel="stylesheet" href="/css/features.css">
  <link rel="stylesheet" href="/css/homepage.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="เปิดเมนู" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <span class="topbar-title" id="topbarTitle">แฟ้มสะสมผลงาน</span>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="side-profile">
      <div class="avatar" id="sideAvatar"></div>
      <div>
        <div class="side-name" id="sideName">กำลังโหลด…</div>
        <div class="side-role" id="sideRole"></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot foot-links"><a class="back-home" href="/">← หน้าแรก</a><a class="back-home" href="/admin/">เข้าสู่ระบบครู</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main" tabindex="-1">
    <div class="loading">กำลังโหลด…</div>
  </main>

  <dialog class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="ปิด">×</button>
    <img id="lightboxImg" alt="">
    <p id="lightboxCaption"></p>
  </dialog>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <form method="dialog" id="sheetForm" novalidate>
      <div class="sheet-bar">
        <button value="cancel" class="ios-bar-btn" formnovalidate>ยกเลิก</button>
        <h2 id="sheetTitle"></h2>
        <button value="ok" class="ios-bar-btn strong">บันทึก</button>
      </div>
      <div class="sheet-body"><div id="sheetFields" class="ios-group"></div></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/ios.js"></script>
  <script src="/js/vendor/qrcode.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/features.js"></script>
  <script src="/js/homepage.js"></script>
</body>
</html>
